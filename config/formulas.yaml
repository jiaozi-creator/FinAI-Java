# 公式版本管理

version: "1.0.0"

# 增长率计算
growth_rates:
  - id: "yoy_growth"
    name: "同比增长率"
    formula: "(current - prior_year) / abs(prior_year) * 100"
    note: "当prior_year为0时返回null"

  - id: "qoq_growth"
    name: "环比增长率"
    formula: "(current - prior_quarter) / abs(prior_quarter) * 100"
    note: "当prior_quarter为0时返回null"

# 财务比率
financial_ratios:
  - id: "gross_margin"
    name: "毛利率"
    formula: "(revenue - operating_cost) / revenue * 100"

  - id: "net_margin"
    name: "净利率"
    formula: "net_profit / revenue * 100"

  - id: "roe"
    name: "净资产收益率(ROE)"
    formula: "net_profit / avg_net_assets * 100"
    note: "使用期初期末平均净资产"

  - id: "roa"
    name: "总资产收益率(ROA)"
    formula: "net_profit / avg_total_assets * 100"

  - id: "asset_liability_ratio"
    name: "资产负债率"
    formula: "total_liabilities / total_assets * 100"

  - id: "current_ratio"
    name: "流动比率"
    formula: "current_assets / current_liabilities"

  - id: "quick_ratio"
    name: "速动比率"
    formula: "(current_assets - inventory) / current_liabilities"

  - id: "cash_to_debt_ratio"
    name: "现金短债比"
    formula: "cash_and_equivalents / short_term_debt"

  - id: "ocf_to_net_profit"
    name: "经营现金流净利润比"
    formula: "operating_cash_flow / net_profit"

# 运营指标
operating_metrics:
  - id: "accounts_receivable_turnover"
    name: "应收账款周转率"
    formula: "revenue / avg_accounts_receivable"

  - id: "inventory_turnover"
    name: "存货周转率"
    formula: "operating_cost / avg_inventory"

  - id: "total_asset_turnover"
    name: "总资产周转率"
    formula: "revenue / avg_total_assets"

# 估值指标
valuation_metrics:
  - id: "pe_ratio"
    name: "市盈率(PE)"
    formula: "market_cap / net_profit"

  - id: "pb_ratio"
    name: "市净率(PB)"
    formula: "market_cap / net_assets"

  - id: "ev_ebitda"
    name: "企业价值倍数(EV/EBITDA)"
    formula: "(market_cap + net_debt) / ebitda"

# DCF估值
dcf_valuation:
  - id: "free_cash_flow"
    name: "自由现金流"
    formula: "operating_cash_flow - capex"

  - id: "wacc"
    name: "加权平均资本成本"
    formula: "(equity_weight * cost_of_equity) + (debt_weight * cost_of_debt * (1 - tax_rate))"

  - id: "terminal_value"
    name: "终值"
    formula: "fcf_terminal * (1 + terminal_growth_rate) / (wacc - terminal_growth_rate)"

  - id: "enterprise_value"
    name: "企业价值"
    formula: "sum(pv_fcf) + pv_terminal_value"

  - id: "equity_value"
    name: "股权价值"
    formula: "enterprise_value - net_debt"

# 敏感性分析
sensitivity_analysis:
  - id: "wacc_sensitivity"
    name: "WACC敏感性"
    range: [-2%, -1%, 0, +1%, +2%]

  - id: "terminal_growth_sensitivity"
    name: "永续增长率敏感性"
    range: [-1%, -0.5%, 0, +0.5%, +1%]

# 会计恒等式
accounting_identities:
  - id: "balance_sheet_identity"
    name: "资产负债表恒等式"
    formula: "total_assets = total_liabilities + net_assets"
    tolerance: 0.01  # 允许0.01%的舍入误差

  - id: "profit_retention"
    name: "利润留存恒等式"
    formula: "retained_earnings_end = retained_earnings_begin + net_profit - dividends"
    tolerance: 0.01
